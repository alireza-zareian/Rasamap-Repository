<text class="key" x="1006" y="40" text-anchor="end">هر دایره یک فایل است؛ هرچه فایل خط بیشتری داشته باشد دایره‌اش بزرگ‌تر است، و هرچه به مرکزِ نوارش نزدیک‌تر باشد فایل‌های بیشتری آن را import می‌کنند.</text>
