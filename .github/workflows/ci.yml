name: CI

# Lint, type-check and the full test suite on every push and pull request.
# Until this existed nothing ran them except a person remembering to.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Unit tests, then a production build and the API and importer suites
      # against it (test/run.mjs). Needs no secrets: the runner sets its own env.
      - name: Test
        run: npm test

      # The 11 browser flows (test/e2e.test.mjs) against their own production
      # build on :3200. GitHub's Ubuntu runners ship Google Chrome; the suite
      # drives it over DevTools, with no Playwright download. Screenshots of a
      # failure are kept as an artifact.
      - name: Browser tests
        # A hang is a failure, not a six-hour wait.
        timeout-minutes: 15
        run: CHROME_PATH="$(command -v google-chrome)" npm run test:e2e

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
